[project]
name = "greendots_plugin"
version = "0.1.10"
description = "Pytest plugin for generating greendots-compatible logs and status updates"
authors = [
    { name = "Itay Almog", email = "itay2828@gmail.com" },
    { name = "David Shlemayev", email = "david.shlemayev@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]
dependencies = []

[project.urls]
Repository = "https://github.com/wazzaps/greendots"

[project.entry-points.pytest11]
greendots_plugin = "greendots_plugin.plugin"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.5.6",
    "mypy>=1.8",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "greendots_plugin"

[tool.ruff]
line-length = 99

[tool.mypy]
python_version = "3.8"
strict = true
files = ["greendots_plugin"]
